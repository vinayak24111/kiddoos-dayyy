<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 🎂</title>

<style>
body {
  margin: 0;
  font-family: 'Comic Sans MS', cursive;
  overflow: hidden;
  color: white;
}

/* VIDEO BACKGROUND */
video {
  position: fixed;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

/* OVERLAY */
.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(255, 182, 193, 0.3);
  z-index: -1;
}

.container {
  text-align: center;
  position: relative;
  top: 50%;
  transform: translateY(-50%);
  padding: 20px;
}

h1 {
  font-size: 28px;
  text-shadow: 0 0 10px pink;
}

img {
  width: 220px;
  border-radius: 20px;
  margin-top: 20px;
  box-shadow: 0 0 20px pink;
  animation: pop 0.6s ease;
}

button {
  margin-top: 25px;
  padding: 12px 25px;
  border-radius: 30px;
  border: none;
  background: pink;
  color: white;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 10px pink;
}

@keyframes pop {
  from {transform: scale(0.7); opacity: 0;}
  to {transform: scale(1); opacity: 1;}
}
</style>
</head>

<body>

<video autoplay muted loop>
  <source src="bg.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<audio autoplay loop>
  <source src="music.mp3" type="audio/mp3">
</audio>

<div class="container" id="screen">
  <h1 id="text"></h1>
  <button onclick="next()">Tap here 💖</button>
</div>

<script>
let step = 0;

function typeText(text) {
  let i = 0;
  const el = document.getElementById("text");
  el.innerHTML = "";
  let interval = setInterval(() => {
    el.innerHTML += text.charAt(i);
    i++;
    if (i >= text.length) clearInterval(interval);
  }, 40);
}

function next() {
  const s = document.getElementById("screen");

  if (step === 0) {
    s.innerHTML = "<h1 id='text'></h1><button onclick='next()'>Next 💕</button>";
    typeText("Happy Birthdayyyyy 🎂✨");
  }

  else if (step === 1) {
    s.innerHTML = "<h1 id='text'></h1><img src='img1.jpg'><button onclick='next()'>Next 💕</button>";
    typeText("First date… still cute 😭");
  }

  else if (step === 2) {
    s.innerHTML = "<h1 id='text'></h1><img src='img2.jpg'><button onclick='next()'>Next 💕</button>";
    typeText("My sweater thief 🧸");
  }

  else if (step === 3) {
    s.innerHTML = "<h1 id='text'></h1><img src='img3.jpg'><button onclick='next()'>Next 💕</button>";
    typeText("Diwali glow up fr ✨");
  }

  else if (step === 4) {
    s.innerHTML = "<h1 id='text'></h1><img src='img4.jpg'><button onclick='next()'>Next 💕</button>";
    typeText("Kiddo since day 1 🥹");
  }

  else if (step === 5) {
    s.innerHTML = "<h1 id='text'></h1><button onclick='next()'>Next 💕</button>";
    typeText("Things changed…");
  }

  else if (step === 6) {
    s.innerHTML = "<h1 id='text'></h1><button onclick='next()'>Next 💕</button>";
    typeText("But memories didn’t ✨");
  }

  else if (step === 7) {
    s.innerHTML = "<h1 id='text'></h1>";
    typeText("Stay happy always, okay? 💖");
  }

  step++;
}
</script>

<!-- FLOATING HEARTS -->
<script>
setInterval(() => {
  const heart = document.createElement("div");
  heart.innerHTML = "💖";
  heart.style.position = "absolute";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.top = "100vh";
  heart.style.fontSize = "20px";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.style.top = "-10vh";
    heart.style.transition = "4s linear";
  }, 100);

  setTimeout(() => heart.remove(), 4000);
}, 300);
</script>

</body>
</html>
